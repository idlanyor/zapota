server {
    listen 80;
    listen [::]:80;
    server_name kanata.irengcloud.com;

    root /home/roy/mybot/php_client;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/kanata.irengcloud.com.access.log;
    error_log /var/log/nginx/kanata.irengcloud.com.error.log;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ ^/(?:includes|db)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
